# Weekly, and grouped per ecosystem, so an update is one pull request to review rather than
# twenty. Only minor and patch updates are grouped: a major version gets its own pull request,
# because the first grouped round bundled Mantine 9 and TypeScript 7 (which break the build)
# and eleven major action bumps (which the pull request's checks cannot exercise, since they
# never run the release or image workflows) with updates that were safe to merge. The workflows' actions are pinned to commits; Dependabot moves the commit and the
# version comment together.
#
# The worker image's Python packages are pinned in worker/requirements.lock, which Dependabot
# does not read. Re-pin those with `make worker-lock`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /webapp
    schedule: { interval: weekly }
    groups:
      webapp: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    groups:
      desktop-npm: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    groups:
      desktop-cargo: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /worker
    schedule: { interval: weekly }
    groups:
      worker-python: { patterns: ["*"], update-types: [minor, patch] }

  # The Debian digest in worker/Dockerfile and in the openEMS image it starts FROM, in one pull
  # request: test_openems_image fails if the two differ. Merging it rebuilds openEMS (tens of
  # minutes per architecture) and changes no worker until worker/Dockerfile's OPENEMS_IMAGE moves.
  - package-ecosystem: docker
    directories: [/worker, /worker/openems-image]
    schedule: { interval: weekly }
    groups:
      debian: { patterns: ["*"] }
