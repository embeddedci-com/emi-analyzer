# Weekly, and grouped per ecosystem, so an update is one pull request to review rather than
# twenty. The workflows' actions are pinned to commits; Dependabot moves the commit and the
# version comment together.
#
# The worker image's Python packages are pinned in worker/requirements.lock, which Dependabot
# does not read. Re-pin those with `make worker-lock`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /webapp
    schedule: { interval: weekly }
    groups:
      webapp: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    groups:
      desktop-npm: { patterns: ["*"] }

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    groups:
      desktop-cargo: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /worker
    schedule: { interval: weekly }
    groups:
      worker-python: { patterns: ["*"] }

  # The base image digest in worker/Dockerfile.
  - package-ecosystem: docker
    directory: /worker
    schedule: { interval: weekly }
