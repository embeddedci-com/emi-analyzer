# Builds the desktop app for every platform and attaches the installers to a draft release.
#
#   push tag vX.Y.Z             build X.Y.Z and attach everything to a draft release for the tag
#   run manually, tag given     the same, for a tag that already exists (e.g. to retry a release)
#   run manually, no tag        a test build: installers are kept as workflow artifacts only
#
# The version (v1.2.3 -> 1.2.3) is stamped into both halves: the Go sidecar, where it selects
# the worker image tag, and the Tauri bundle.
#
# The draft release is created once, before the platform jobs start, and they upload into it by
# id. Letting each of the four jobs look the release up by tag creates four drafts: GitHub does
# not return a draft release when it is asked for a tag.
#
# Installers are not code-signed. See README.md for what that means on each platform.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0). Leave empty for a test build."
        required: false
      version:
        description: "Version for a test build without a tag (no v prefix). Ignored when a tag is given."
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Tag and version
        id: v
        # Inputs reach the script as environment variables, never pasted into it, so a tag
        # name cannot become shell.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$INPUT_TAG"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if [ -n "$tag" ]; then
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::$tag is not a version tag (vX.Y.Z)"; exit 1
            fi
            if ! git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag does not exist"; exit 1
            fi
            version="${tag#v}"
          else
            version="$INPUT_VERSION"
            [ -n "$version" ] || version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${tag:-<none, test build>} version=$version"

      - name: Draft release
        id: release
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          id=$(gh api "repos/$GH_REPO/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            notes="Install instructions: https://github.com/$GH_REPO#readme

          This release starts the worker image \`ghcr.io/${{ github.repository_owner }}/emi-worker:$VERSION\`."
            id=$(gh api "repos/$GH_REPO/releases" -X POST \
                   -f tag_name="$TAG" -f name="EMI Analyzer $VERSION" -f body="$notes" \
                   -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "release id $id for $TAG"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, goos: darwin, goarch: arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, goos: darwin, goarch: amd64 }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, goos: linux, goarch: amd64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, goos: windows, goarch: amd64, ext: .exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      # The tag's commit, not whatever branch a manual run was started from. v0.1.0's
      # installers were built from main by a rerun and labelled with a tag three commits older.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag && format('refs/tags/{0}', needs.prepare.outputs.tag) || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the webapp
        run: |
          cd webapp && npm ci && npm run build:app
          cd .. && cp -R webapp/dist-app/. server/cmd/emi-local/web/

      - name: Build the emi-local sidecar
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p desktop/src-tauri/binaries
          cd server && go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o ../desktop/src-tauri/binaries/emi-local-${{ matrix.target }}${{ matrix.ext }} ./cmd/emi-local

      - name: Install the Tauri CLI
        run: cd desktop && npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --config '{"version":"${{ env.VERSION }}"}'
          # Empty for a test build, which then uploads nothing.
          releaseId: ${{ needs.prepare.outputs.release_id }}

      - name: Standalone emi-local binary
        id: sidecar
        run: |
          f=emi-local-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          cp desktop/src-tauri/binaries/emi-local-${{ matrix.target }}${{ matrix.ext }} "$f"
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        if: env.RELEASE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.sidecar.outputs.file }}
        run: |
          # A retried release already has the asset, and GitHub refuses a second one by name.
          old=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
                  --jq ".[] | select(.name == \"$FILE\") | .id")
          if [ -n "$old" ]; then gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$old"; fi
          gh api -X POST -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${FILE}" \
            --input "$FILE" --jq .browser_download_url

      - name: Keep a test build as workflow artifacts
        if: env.RELEASE_ID == ''
        uses: actions/upload-artifact@v4
        with:
          name: emi-analyzer-${{ matrix.target }}
          path: |
            ${{ steps.sidecar.outputs.file }}
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: warn
