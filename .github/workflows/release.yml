# Builds the desktop app for every platform and attaches the installers to a draft release.
#
#   push tag vX.Y.Z             build X.Y.Z and attach everything to a draft release for the tag
#   run manually, tag given     the same, for a tag that already exists (e.g. to retry a release)
#   run manually, no tag        a test build: installers are kept as workflow artifacts only
#
# The version (v1.2.3 -> 1.2.3) is stamped into both halves: the Go sidecar, where it selects
# the worker image tag, and the Tauri bundle.
#
# Order: the test workflow runs on the tag's commit first, and nothing is built if it fails.
# The platform jobs only build, with a read-only token, and hand their files on as workflow
# artifacts. One job at the end creates the draft release, writes SHA256SUMS over everything
# and uploads it all; it is the only job that can write to the repository.
#
# Creating the draft once, in one job, also matters on its own: letting each platform job look
# the release up by tag created four drafts, because GitHub does not return a draft release
# when it is asked for a tag.
#
# Installers are not code-signed. See README.md for what that means on each platform.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0). Leave empty for a test build."
        required: false
      version:
        description: "Version for a test build without a tag (no v prefix). Ignored when a tag is given."
        required: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - name: Tag and version
        id: v
        # Inputs reach the script as environment variables, never pasted into it, so a tag
        # name cannot become shell.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$INPUT_TAG"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if [ -n "$tag" ]; then
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::$tag is not a version tag (vX.Y.Z)"; exit 1
            fi
            if ! git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag does not exist"; exit 1
            fi
            version="${tag#v}"
            ref="refs/tags/$tag"
          else
            version="$INPUT_VERSION"
            [ -n "$version" ] || version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            ref="$GITHUB_REF"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "tag=${tag:-<none, test build>} version=$version ref=$ref"

  # The whole test workflow, on the commit being released. v0.1.0 went out without it.
  test:
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  desktop:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is arm64; the x86_64 build cross-compiles there (Rust gets the target
        # below, Go needs nothing). ubuntu-22.04, not 24.04: the .deb and AppImage link
        # against its older glibc and webkit, so they install on more distributions.
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, goos: darwin, goarch: arm64 }
          - { runner: macos-15, target: x86_64-apple-darwin, goos: darwin, goarch: amd64 }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, goos: linux, goarch: amd64 }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, goos: windows, goarch: amd64, ext: .exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The tag's commit, not whatever branch a manual run was started from. v0.1.0's
      # installers were built from main by a rerun and labelled with a tag three commits older.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the webapp
        run: |
          cd webapp && npm ci && npm run build:app
          cd .. && cp -R webapp/dist-app/. server/cmd/emi-local/web/

      - name: Build the emi-local sidecar
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p desktop/src-tauri/binaries
          cd server && go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o ../desktop/src-tauri/binaries/emi-local-${{ matrix.target }}${{ matrix.ext }} ./cmd/emi-local

      # The Tauri CLI directly, not tauri-action: the action always uploads the macOS .app as
      # a .app.tar.gz, which is an updater archive, and this app has no updater. It also
      # needed a write token in every platform job.
      - name: Build the desktop app
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd desktop && npm ci
          npx tauri build --target "$TARGET" --config "{\"version\":\"$VERSION\"}"

      # Everything this platform contributes, in one flat folder. GitHub turns a space in an
      # asset name into a dot, so the files are renamed here and SHA256SUMS lists the names
      # people will actually download.
      - name: Collect the files
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir out
          cp "desktop/src-tauri/binaries/emi-local-${TARGET}${{ matrix.ext }}" \
             "out/emi-local-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          find "$bundle" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -print0 |
            while IFS= read -r -d '' f; do
              name=$(basename "$f"); cp "$f" "out/${name// /.}"
            done
          ls -l out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emi-analyzer-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [prepare, desktop]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: emi-analyzer-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Draft release
        id: release
        run: |
          id=$(gh api "repos/$GH_REPO/releases" --paginate \
                 --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            notes="Install instructions: https://github.com/$GH_REPO#readme

          This release starts the worker image \`ghcr.io/${{ github.repository_owner }}/emi-worker:$VERSION\`.

          SHA256SUMS lists a checksum for every file here: \`sha256sum -c SHA256SUMS --ignore-missing\`."
            id=$(gh api "repos/$GH_REPO/releases" -X POST \
                   -f tag_name="$TAG" -f name="EMI Analyzer $VERSION" -f body="$notes" \
                   -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "release id $id for $TAG"

      - name: Upload
        working-directory: dist
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          for f in *; do
            # A retried release already has the asset, and GitHub refuses a second one by name.
            old=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate \
                    --jq ".[] | select(.name == \"$f\") | .id")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GH_REPO/releases/assets/$old"; fi
            gh api -X POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$f" \
              --input "$f" --jq .browser_download_url
          done
