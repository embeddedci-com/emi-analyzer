# Every action is pinned to a commit, with its version in a comment. A tag can be moved to
# other code after the fact; a commit cannot. Dependabot keeps the pins current.
name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this on the commit it is about to ship, and ships nothing if
  # it fails. `ref` is that commit's tag: a release started by hand runs from a branch, and
  # without it these jobs would test the branch instead of the tag.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (defaults to the commit that triggered the run)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: make test-go

  webapp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: cd webapp && npm ci && npm run typecheck && npm test && npm run build:app

  # The desktop app's own Rust: the window, the tray and starting the sidecar. Nothing else
  # compiles it before a release does. `cargo check` needs what tauri's build script checks
  # for: the sidecar named in tauri.conf.json (an empty file is enough to check against) and
  # the frontend folder, which is committed (desktop/loading). ubuntu-22.04 and the package
  # list are the release build's, so a check that passes here means the same there.
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Placeholder sidecar
        run: |
          mkdir -p desktop/src-tauri/binaries
          touch "desktop/src-tauri/binaries/emi-local-$(rustc -vV | sed -n 's/^host: //p')"
      - run: cd desktop/src-tauri && cargo check --locked --all-targets

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The tests run inside the worker image, which is the only place ngspice, nec2c and
      # openEMS are guaranteed to be the versions the worker is built against. It starts FROM
      # the prebuilt openEMS image (OPENEMS_IMAGE), so this pulls openEMS rather than
      # compiling it, and the build runs the same inductor probe a solve does.
      - run: docker build -t emi-worker-test worker
      # Mounted read-only and copied, because the image runs as a non-root user and the tests
      # read fixtures from server/, the rule catalogue from webapp/ and the rules file from docs/.
      - run: |
          docker run --rm --user root --entrypoint sh -v "$PWD:/repo:ro" emi-worker-test -c '
            pip install -q "pytest==9.1.1" &&
            mkdir /tmp/repo && cp -r /repo/worker /repo/server /repo/webapp /repo/docs /tmp/repo/ &&
            cd /tmp/repo/worker && python -m pytest -q -p no:cacheprovider'

  # The KiCad plugin is plain Python and its tests stand in for KiCad and for the app, so
  # they run here without either. The few that need PySide6 skip themselves.
  # 3.9 because plugin.json promises it (a Linux KiCad runs on the system Python), 3.11 because
  # that is what KiCad bundles on Windows and macOS. pytest 8.4 is the last to support 3.9.
  kicad-plugin:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "pytest==8.4.2"
      - run: make plugin-test
