# Builds the worker image and pushes it to the GitHub Container Registry.
#
#   push to main (worker/ changed)   :main  :dev  :sha-<short>
#   run manually                     the same, from whatever ref is chosen
#   tag vX.Y.Z                       :X.Y.Z  :latest
#
# `dev` is what a build that is not a release starts: `make local`, `make desktop` and anyone
# running from source all stamp the version "dev", and emi-local turns that into this tag. It
# follows main, so a contributor gets the worker their checkout expects without building a
# 1 GB image first.
#
# The desktop app starts the image whose tag equals its own version, so every release tag must
# produce that tag here -- the release workflow waits for nothing, but a release is not usable
# until this job has pushed X.Y.Z. Which is why the decision to build is made in a job below
# rather than by a `paths:` filter on the trigger: whether a path filter matches the push of a
# tag is not something GitHub documents, and a release that silently ships with no worker image
# is the worst failure this repository has.
#
# amd64 and arm64: the arm64 half is what makes a solve on Apple Silicon run natively instead of
# under emulation. It builds under QEMU, which is slow but needs no special runner.
name: worker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/emi-worker

jobs:
  # Is there anything to build? A tag always is: see the note at the top. On main, only when
  # the worker or this file changed -- the build takes an hour under QEMU.
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          reason=""
          if [ "$REF_TYPE" = "tag" ]; then
            reason="a tag needs an image carrying its own version"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            reason="asked for by hand"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            reason="there is no previous commit to compare with"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            reason="the previous commit is not in this checkout"
          elif ! git diff --quiet "$BEFORE" "$SHA" -- worker .github/workflows/worker-image.yml; then
            reason="the worker changed"
          fi
          if [ -n "$reason" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "building: $reason"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nothing to do: the worker did not change"
          fi

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # What every build that is not a release starts. See the note at the top.
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=EMI Analyzer worker
            org.opencontainers.image.description=Board ingest, EMI/EMC rule checks, ngspice ESD transients and openEMS solves for the EMI Analyzer
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
