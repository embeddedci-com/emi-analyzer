# Builds the worker image and pushes it to the GitHub Container Registry.
#
#   push to main (worker/ changed)   ghcr.io/embeddedci-com/emi-worker:main  and  :sha-<short>
#   tag vX.Y.Z                       ghcr.io/embeddedci-com/emi-worker:X.Y.Z and  :latest
#
# The desktop app starts the image whose tag equals its own version, so every release tag must
# produce that tag here -- the release workflow waits for nothing, but a release is not usable
# until this job has pushed X.Y.Z.
#
# amd64 and arm64: the arm64 half is what makes a solve on Apple Silicon run natively instead of
# under emulation. It builds under QEMU, which is slow but needs no special runner.
name: worker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "worker/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/emi-worker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=EMI Analyzer worker
            org.opencontainers.image.description=Board ingest, EMI/EMC rule checks, ngspice ESD transients and openEMS solves for the EMI Analyzer
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
