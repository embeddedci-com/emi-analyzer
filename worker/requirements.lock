# The exact Python packages in the worker image. pyproject.toml keeps ranges, so the worker
# still installs anywhere; the image installs with this file as a constraint, so two builds
# of the same commit get the same wheels.
#
# Regenerate with `make worker-lock` (a clean install in the image's own base, then
# `pip freeze --all`). Every binary package here has cp311 manylinux wheels for both x86_64
# and aarch64; check that before bumping, or the arm64 image starts compiling from source.
#
# gerbonara is installed with --no-deps (see the Dockerfile), so only its own line matters.
